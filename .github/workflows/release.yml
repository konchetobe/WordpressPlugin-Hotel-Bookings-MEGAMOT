name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.4.0 or 1.4.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: ${{ inputs.version }}. Expected e.g. 1.4.0 or 1.4.0-beta.1"
            exit 1
          fi

      - name: Bump version headers
        run: |
          sed -i "s/^ \* Version: .*/ * Version: ${{ inputs.version }}/" sanctuary-hotel-booking.php
          sed -i "s/^define('SHB_VERSION', '[^']*');/define('SHB_VERSION', '${{ inputs.version }}');/" sanctuary-hotel-booking.php
          sed -i "s/^define('SHB_DB_VERSION', '[^']*');/define('SHB_DB_VERSION', '${{ inputs.version }}');/" sanctuary-hotel-booking.php
          sed -i "s/^Stable tag: .*/Stable tag: ${{ inputs.version }}/" readme.txt

      - name: Verify bump
        run: |
          grep -n "Version: ${{ inputs.version }}" sanctuary-hotel-booking.php
          grep -n "SHB_VERSION', '${{ inputs.version }}'" sanctuary-hotel-booking.php
          grep -n "Stable tag: ${{ inputs.version }}" readme.txt

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sanctuary-hotel-booking.php readme.txt
          # --allow-empty covers the case where the version was already bumped
          # in the working tree before this workflow ran.
          git commit --allow-empty -m "Bump version to ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin main --tags

      - name: Build plugin ZIP
        run: |
          mkdir -p dist/sanctuary-hotel-booking
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.commandcode' \
            --exclude='.agent' \
            --exclude='.aiignore' \
            --exclude='AGENTS.md' \
            --exclude='ARCHITECTURE.md' \
            --exclude='MULTI_LOCATION_PLAN.md' \
            --exclude='PROJECT_STRUCTURE.md' \
            --exclude='SKELETON.md' \
            --exclude='tests' \
            --exclude='dist' \
            ./ dist/sanctuary-hotel-booking/
          cd dist
          zip -r "sanctuary-hotel-booking-${{ inputs.version }}.zip" sanctuary-hotel-booking
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          files: "dist/sanctuary-hotel-booking-${{ inputs.version }}.zip"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
